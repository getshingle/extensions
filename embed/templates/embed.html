<figure class="embed">
  <div class="embed-frame" style="{{EMBED_STYLE}}" data-src="{{EMBED_SRC}}" data-title="{{EMBED_TITLE}}">
    <p class="embed-title">{{EMBED_TITLE}}</p>
    <p class="actions"><button class="btn primary" type="button" hidden>{{EMBED_BUTTON}}</button> <a class="btn" href="{{EMBED_OPEN}}" target="_blank" rel="noopener">{{EMBED_LINK}} ↗</a></p>
    <p class="embed-note">{{EMBED_NOTE}}</p>
  </div>
  <figcaption>{{EMBED_CAPTION}}</figcaption>
</figure>
