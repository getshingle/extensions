<article class="{{ITEM_CLASS}}">
  <p class="badge">{{ITEM_BADGE}}</p>
  <h2>{{ITEM_TITLE}}</h2>
  <p>{{ITEM_SUMMARY}}</p>
  <p class="price"><span class="monthly">{{ITEM_PRICE}} <small>{{ITEM_PERIOD}}</small></span><span class="yearly">{{ITEM_PRICE_YEARLY}} <small>{{ITEM_PERIOD_YEARLY}}</small></span></p>
  <div class="features">
{{ITEM_BODY}}
  </div>
  <p><a class="{{ITEM_BUTTON_CLASS}}" href="{{ITEM_LINK}}"{{ITEM_LINK_ATTRS}}>{{ITEM_BUTTON}}</a></p>
</article>
